name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm style:check
      - run: pnpm typecheck
      - run: pnpm knip

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install herdr
        env:
          herdrVersion: 0.9.1
          herdrSha256: 2a02fed16beb651ef006e1d43f048f652ca4dc58ad053cd2d44450563d5c54b7
        run: |
          mkdir -p "${RUNNER_TEMP}/herdr"
          curl --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/herdr/herdr" \
            "https://github.com/herdrdev/herdr/releases/download/v${herdrVersion}/herdr-linux-x86_64"
          echo "${herdrSha256}  ${RUNNER_TEMP}/herdr/herdr" | sha256sum --check
          chmod +x "${RUNNER_TEMP}/herdr/herdr"
          echo "${RUNNER_TEMP}/herdr" >> "${GITHUB_PATH}"
      - run: pnpm test
