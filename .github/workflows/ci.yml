name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm style:check
      - run: pnpm typecheck
      - run: pnpm knip

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install hc
        env:
          hcVersion: 0.1.16
          hcSha256: 58d6861176dc6fe905b58880d5bff07a9959be613a98e5d66b4583b04b6cfa45
        run: |
          mkdir -p "${RUNNER_TEMP}/hc"
          curl --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/hc/herdr-core.tar.gz" \
            "https://releases.herdr.dev/core/${hcVersion}/herdr-core-linux-x86_64.tar.gz"
          echo "${hcSha256}  ${RUNNER_TEMP}/hc/herdr-core.tar.gz" | sha256sum --check
          tar --extract --file "${RUNNER_TEMP}/hc/herdr-core.tar.gz" --directory "${RUNNER_TEMP}/hc"
          chmod +x "${RUNNER_TEMP}/hc/herdr-core"
          ln -s "${RUNNER_TEMP}/hc/herdr-core" "${RUNNER_TEMP}/hc/hc"
          echo "${RUNNER_TEMP}/hc" >> "${GITHUB_PATH}"
      - name: Read the Ubuntu release
        id: ubuntu
        run: |
          source /etc/os-release
          echo "release=${VERSION_ID}" >> "${GITHUB_OUTPUT}"
      # The packages come from the cache so that the job needs the Ubuntu package mirror only when the
      # cache is empty. They link against the libraries of one Ubuntu release, so the release is part
      # of the key.
      - name: Restore the zsh packages
        id: zshPackages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/zsh-packages
          key: zsh-packages-${{ runner.arch }}-ubuntu-${{ steps.ubuntu.outputs.release }}
      - name: Download the zsh packages
        if: steps.zshPackages.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${RUNNER_TEMP}/zsh-packages"
          cd "${RUNNER_TEMP}/zsh-packages"
          sudo apt-get update
          apt-get download zsh zsh-common
      # Saving here, not after the job, keeps the packages when a later step fails.
      - name: Save the zsh packages
        if: steps.zshPackages.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/zsh-packages
          key: ${{ steps.zshPackages.outputs.cache-primary-key }}
      # Without zsh the tests of shell/resume-pi.zsh skip, so the step fails when zsh does not run.
      - name: Install zsh
        run: |
          sudo dpkg --install "${RUNNER_TEMP}"/zsh-packages/*.deb
          zsh --version
      - name: Install cargo-nextest
        env:
          cargoNextestVersion: 0.9.148
          cargoNextestSha256: 223ba936714cc861a9cdedad5a8eb664dfdd69d6fbdf6cea6aa8184f523290dc
        run: |
          mkdir -p "${RUNNER_TEMP}/cargo-nextest"
          curl --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/cargo-nextest/cargo-nextest.tar.gz" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${cargoNextestVersion}/cargo-nextest-${cargoNextestVersion}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${cargoNextestSha256}  ${RUNNER_TEMP}/cargo-nextest/cargo-nextest.tar.gz" | sha256sum --check
          tar --extract --file "${RUNNER_TEMP}/cargo-nextest/cargo-nextest.tar.gz" --directory "${RUNNER_TEMP}/cargo-nextest"
          chmod +x "${RUNNER_TEMP}/cargo-nextest/cargo-nextest"
          echo "${RUNNER_TEMP}/cargo-nextest" >> "${GITHUB_PATH}"
      - run: pnpm test

  mutation:
    name: Mutation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Stryker reuses a result while the mutated code and the tests that covered it are unchanged. It
      # does not see helpers outside a test body, fixtures, dependencies, or config, so their hash is
      # part of the key. A change to unmutated production code can still leave a stale result.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tau/stryker-incremental.json
          key: mutation-incremental-${{ github.event.pull_request.number }}-${{ hashFiles('tests/**', 'src/**/*.test.ts', 'src/**/fixtures/**', 'pnpm-lock.yaml', 'vite.config.ts', 'stryker.config.json', 'stryker.vitest.config.ts') }}-${{ github.sha }}
          restore-keys: mutation-incremental-${{ github.event.pull_request.number }}-${{ hashFiles('tests/**', 'src/**/*.test.ts', 'src/**/fixtures/**', 'pnpm-lock.yaml', 'vite.config.ts', 'stryker.config.json', 'stryker.vitest.config.ts') }}-
      - name: Mutation-test changed lines
        env:
          baseSha: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -t command < <(jq --raw-output '.mutation.argv[]' .pi/tau.json)
          report="${RUNNER_TEMP}/mutation-report.json"
          # The job has the runner to itself, so it uses every CPU. Local runs leave room for other work.
          config="${RUNNER_TEMP}/stryker.config.json"
          jq '.concurrency = "100%"' stryker.config.json > "${config}"
          status=0
          "${command[@]}" changed "${baseSha}" --config "${config}" > "${report}" || status=$?
          if [ "${status}" -ne 0 ] && [ "${status}" -ne 2 ]; then
            cat "${report}" || true
            exit "${status}"
          fi
          if ! jq --exit-status '(.status | IN("pass", "nothing", "survivors")) and (.survivors | type == "array")' "${report}" > /dev/null; then
            echo "The mutation report is missing, malformed, has no survivors array, or has a status other than pass, nothing, or survivors." >&2
            cat "${report}" || true
            exit 1
          fi
          count=$(jq '.survivors | length' "${report}")
          if [ "${count}" -gt 0 ]; then
            {
              echo "Mutation survivors: ${count}"
              echo
              jq --raw-output '.survivors[] | "- \(.file):\(.line) \(.mutator): \(.original) => \(.replacement)\(if .covered == false then " (no coverage)" else "" end)"' "${report}"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
