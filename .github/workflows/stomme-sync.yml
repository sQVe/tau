# The reusable stomme workflow below is pinned to the stomme release commit.
name: Sync stomme

on:
  push:
    branches: [renovate/stomme]

permissions:
  contents: read

jobs:
  sync:
    uses: sQVe/stomme/.github/workflows/sync-update.yml@9f180438089fc15639b32bec3325ae20bacb6fb2 # v0.2.8
    secrets:
      app-id: ${{ secrets.STOMME_APP_ID }}
      app-private-key: ${{ secrets.STOMME_APP_PRIVATE_KEY }}
