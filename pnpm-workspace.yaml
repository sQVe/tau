# pi installs packages with auto-install-peers off, so the lockfile must match.
autoInstallPeers: false
# pi resolves extension imports from the literal node_modules path, so
# transitive deps must not sit behind a symlink.
nodeLinker: hoisted
allowBuilds:
  '@google/genai': false
  esbuild: true
  protobufjs: false
overrides:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.3
# Vite+ uses its own version for the Vite-compatible core.
peerDependencyRules:
  allowedVersions:
    vite: 0.3.3
minimumReleaseAgeExclude:
  - '@earendil-works/chord@1.0.0'
  - '@earendil-works/pi-agent-core@1.0.0 || 1.2.0 || 1.3.0 || 1.4.0 || 1.5.0 || 1.6.0'
  - '@earendil-works/pi-ai@1.0.0 || 1.2.0 || 1.3.0 || 1.4.0 || 1.5.0 || 1.6.0'
  - '@earendil-works/pi-codemode@1.0.0 || 1.2.0 || 1.3.0 || 1.4.0 || 1.5.0 || 1.6.0'
  - '@earendil-works/pi-coding-agent@1.0.0 || 1.2.0 || 1.3.0 || 1.4.0 || 1.5.0 || 1.6.0'
  - '@earendil-works/pi-mcp@1.0.0 || 1.2.0 || 1.3.0 || 1.4.0 || 1.5.0 || 1.6.0'
  - '@earendil-works/pi-telemetry@1.0.0 || 1.2.0 || 1.3.0 || 1.4.0 || 1.5.0 || 1.6.0'
  - '@earendil-works/pi-tui@1.0.0 || 1.2.0 || 1.3.0 || 1.4.0 || 1.5.0 || 1.6.0'
  - '@sqve/mutation@0.2.0'
  - '@sqve/stomme-ts-style@0.3.0'
