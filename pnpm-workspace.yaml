# pi resolves extension imports from the literal node_modules path, so
# transitive deps must not sit behind a symlink.
nodeLinker: hoisted
allowBuilds:
  '@google/genai': false
  esbuild: true
  protobufjs: false
overrides:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
# Vite+ uses its own version for the Vite-compatible core.
peerDependencyRules:
  allowedVersions:
    vite: 0.3.0
