# pi resolves extension imports from the literal node_modules path, so
# transitive deps must not sit behind a symlink.
nodeLinker: hoisted
allowBuilds:
  '@google/genai': false
  esbuild: true
  protobufjs: false
overrides:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
# Vite+ uses its own version for the Vite-compatible core.
peerDependencyRules:
  allowedVersions:
    vite: 0.3.0
minimumReleaseAgeExclude:
  - '@earendil-works/chord@1.0.0'
  - '@earendil-works/pi-agent-core@1.0.0'
  - '@earendil-works/pi-ai@1.0.0'
  - '@earendil-works/pi-codemode@1.0.0'
  - '@earendil-works/pi-coding-agent@1.0.0'
  - '@earendil-works/pi-mcp@1.0.0'
  - '@earendil-works/pi-telemetry@1.0.0'
  - '@earendil-works/pi-tui@1.0.0'
